name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Push only app folder to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e  # interrompe se houver erro
          
          git config --global user.email "m.carolina.soares1@gmail.com"
          git config --global user.name "mariacarolinass"

          # Clona o Space do Hugging Face
          git clone https://huggingface.co/spaces/carolinasoares/urban-disaster-monitor-v2 hf_space

          # Verifica se a pasta existe
          if [ ! -d "hf_space" ]; then
            echo "Erro: diretório hf_space não existe"
            exit 1
          fi

          # Limpa o conteúdo antigo
          rm -rf hf_space/*

          # Copia apenas o conteúdo da pasta app
          cp -r app/* hf_space/

          cd hf_space
          git add .
          git commit -m "Update from GitHub"
          git push
